# Gitleaks, Semgrep, pnpm audit, and Trivy on the source tree.
# Critical and high findings fail the job. Medium findings are uploaded and do not fail it.
# Called by ci and release. No image push and no SSH.

name: security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            detect \
            --source /repo \
            --redact \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif \
            --exit-code 1

      - name: Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            semgrep/semgrep:1.117.0 \
            semgrep scan \
              --config p/javascript \
              --config p/typescript \
              --config p/nodejs \
              --config p/docker \
              --metrics=off \
              --json \
              --output semgrep.json
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "Semgrep failed to run."
            exit 2
          fi
          python3 - <<'PY'
          import json
          report = json.load(open("semgrep.json"))
          results = report.get("results", [])
          blocking = [item for item in results if item.get("extra", {}).get("severity") == "ERROR"]
          print(f"semgrep findings: {len(results)}; error severity: {len(blocking)}")
          for item in blocking:
              path = item.get("path")
              line = item.get("start", {}).get("line")
              print(f"{item.get('check_id')} {path}:{line}")
          if blocking:
              raise SystemExit(1)
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm audit
        id: audit
        continue-on-error: true
        run: |
          set -uo pipefail
          fail=0
          (cd backend && pnpm audit --audit-level=high | tee ../backend-pnpm-audit.txt) || fail=1
          (cd frontend && pnpm audit --audit-level=high | tee ../frontend-pnpm-audit.txt) || fail=1
          exit "$fail"

      - name: Trivy filesystem and config
        id: trivy
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            aquasec/trivy:0.58.1 \
            fs \
            --scanners vuln,secret,misconfig \
            --format json \
            --output trivy.json \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            .
          python3 - <<'PY'
          import json
          report = json.load(open("trivy.json"))
          blocking = {"HIGH", "CRITICAL"}
          found = []
          for result in report.get("Results") or []:
              target = result.get("Target", "")
              for vuln in result.get("Vulnerabilities") or []:
                  if vuln.get("Severity") in blocking:
                      found.append(f"{vuln.get('Severity')} {vuln.get('VulnerabilityID')} {vuln.get('PkgName')} {target}")
              for item in result.get("Misconfigurations") or []:
                  if item.get("Severity") in blocking:
                      found.append(f"{item.get('Severity')} {item.get('ID')} {item.get('Title')} {target}")
              for secret in result.get("Secrets") or []:
                  severity = secret.get("Severity")
                  if severity in blocking or severity is None:
                      found.append(f"SECRET {secret.get('RuleID')} {target}:{secret.get('StartLine')}")
          print(f"blocking trivy findings: {len(found)}")
          for line in found[:80]:
              print(line)
          if found:
              raise SystemExit(1)
          PY

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          retention-days: 90
          if-no-files-found: warn
          path: |
            gitleaks.sarif
            semgrep.json
            trivy.json
            backend-pnpm-audit.txt
            frontend-pnpm-audit.txt

      - name: Fail on critical or high findings
        if: always()
        run: |
          set -euo pipefail
          echo "gitleaks=${{ steps.gitleaks.outcome }} semgrep=${{ steps.semgrep.outcome }} audit=${{ steps.audit.outcome }} trivy=${{ steps.trivy.outcome }}"
          test "${{ steps.gitleaks.outcome }}" = "success"
          test "${{ steps.semgrep.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.trivy.outcome }}" = "success"
