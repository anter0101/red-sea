# Pull request and push to main.
# Stages: test → audit → docker.
# Does not push images and does not SSH.

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          node --input-type=module -e "import { readFileSync } from 'node:fs'; JSON.parse(readFileSync('red-sea.postman.json', 'utf8'));"
          pnpm lint:ci
          pnpm typecheck
          pnpm test:cov

      - name: Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test:cov

  audit:
    name: audit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit
        run: |
          pnpm --dir backend audit --audit-level=high
          pnpm --dir frontend audit --audit-level=high

  docker:
    name: docker
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build --tag red-sea-backend:ci backend
          docker build --tag red-sea-frontend:ci \
            --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1 \
            --build-arg NEXT_PUBLIC_BACKEND_URL=http://127.0.0.1 \
            frontend
