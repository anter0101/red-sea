worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# TCP passthrough for PostgreSQL (pg_dump, psql, GUI clients). Published on the nginx service
# as host port POSTGRES_EXPORT_PORT (see docker-compose.yml), not on the HTTP :80 listener.
stream {
    upstream postgres_upstream {
        server postgres:5432;
    }

    server {
        listen 5432;
        proxy_connect_timeout 60s;
        proxy_socket_keepalive on;
        proxy_pass postgres_upstream;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'status=$status rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # Block obvious scanners, scraper stacks, and noisy crawlers (tune regex as needed).
    map $http_user_agent $block_bot {
        default 0;

        ""  1;
        "-" 1;

        ~*(acunetix|nessus|nikto|nuclei|sqlmap|openvas|w3af|dirbuster|gobuster|wfuzz|havij|wpscan|qualys|arachni|skipfish|appscan|burp|zap|owasp) 1;
        ~*(masscan|zmap|nmap(\/|\s|$)|zgrab|shodan|censys|binaryedge|onyphe|pentest|exploit|jndi|\$\{|\$\() 1;

        ~*(scrapy|python-urllib|libwww-perl|mechanize|java\/0\.|java\/1\.|go-http-client|Apache-HttpClient\/|okhttp\/|httpunit|lwp-trivial) 1;

        ~*(ahrefsbot|semrushbot|mj12bot|dotbot|petalbot|bytespider|gptbot|ccbot|anthropic|claudebot|claude-web|amazonbot|barkrowler|dataforseo|serpstat|seokicks|sistrix) 1;
    }

    include /etc/nginx/upstreams.conf;

    upstream minio_upstream {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        if ($block_bot) {
            return 403;
        }

        # Nest login API (browser axios uses relative /api/... in production)
        location = /api/auth/login {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NextAuth and other Next.js routes under /api/auth/
        location ^~ /api/auth/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bucket (presigned PUT/GET). Path must equal BUCKET_NAME, and the path and Host
        # must reach MinIO unchanged or the signature check fails.
        location ^~ /red-sea/ {
            proxy_pass http://minio_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Remaining REST API -> NestJS
        location ^~ /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
