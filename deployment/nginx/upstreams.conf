# Bind-mounted into Nginx. Stage 7 replaces this file, then reloads.
# Until that include is wired, nginx.conf still contains the same two upstreams.
# These names are the workstation services. The VPS uses backend-blue or backend-green.

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8080;
}
