# pre-promote.sh copies this file and replaces the placeholders before ZAP runs.
# The scan is passive. Both colors share Postgres, so this plan does not active-scan.
---
env:
  contexts:
    - name: red-sea-inactive
      urls:
        - __TARGET__
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  - type: requestor
    parameters:
      user: ""
    requests:
      - url: __TARGET__/api/health
        method: GET
        name: health
      - url: __TARGET__/api/auth/login
        method: POST
        name: login
        headers:
          - "Content-Type: application/json"
        data: __LOGIN_JSON__
      - url: "__TARGET__/api/journeys?page=1&pageSize=1&sortField=id&sortOrder=DESC"
        method: GET
        name: journeys-anonymous
      - url: "__TARGET__/api/journeys?page=1&pageSize=1&sortField=id&sortOrder=DESC"
        method: GET
        name: journeys
        headers:
          - "Authorization: Bearer __TOKEN__"
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report.json
      reportTitle: Red Sea inactive color
  - type: outputSummary
    parameters:
      format: Long
